name: Regression Smoke Gate

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/regression-smoke-gate.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/regression-smoke-gate.yml"
  workflow_dispatch:

jobs:
  smoke-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PARTALOG_BASE_URL: ${{ secrets.PARTALOG_BASE_URL }}
      PARTALOG_PUBLIC_TOKEN: ${{ secrets.PARTALOG_PUBLIC_TOKEN }}
      PARTALOG_ADMIN_TOKEN: ${{ secrets.PARTALOG_ADMIN_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate required secret
        id: validate-secrets
        run: |
          set -euo pipefail
          missing=()
          [ -n "${PARTALOG_BASE_URL:-}" ] || missing+=("PARTALOG_BASE_URL")
          [ -n "${PARTALOG_PUBLIC_TOKEN:-}" ] || missing+=("PARTALOG_PUBLIC_TOKEN")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing secrets: ${missing[*]}"
            if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
              echo "run_remote_smoke=false" >> "$GITHUB_OUTPUT"
              echo "Remote regression smoke skipped on pull_request because required secrets are unavailable."
              exit 0
            fi
            exit 1
          fi

          echo "run_remote_smoke=true" >> "$GITHUB_OUTPUT"

      - name: Run regression smoke (remote)
        if: steps.validate-secrets.outputs.run_remote_smoke == 'true'
        run: |
          chmod +x backend/scripts/smoke_all.sh
          backend/scripts/smoke_all.sh \
            --skip-up \
            --skip-ai-check \
            --skip-frontend-check \
            --no-bootstrap \
            --base-url "${PARTALOG_BASE_URL}" \
            --public-token "${PARTALOG_PUBLIC_TOKEN:-}" \
            --admin-token "${PARTALOG_ADMIN_TOKEN:-}"
