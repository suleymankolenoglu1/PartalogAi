name: Regression Smoke Gate

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/regression-smoke-gate.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/regression-smoke-gate.yml"
  workflow_dispatch:

jobs:
  smoke-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PARTALOG_BASE_URL: ${{ secrets.PARTALOG_BASE_URL }}
      PARTALOG_PUBLIC_TOKEN: ${{ secrets.PARTALOG_PUBLIC_TOKEN }}
      PARTALOG_ADMIN_TOKEN: ${{ secrets.PARTALOG_ADMIN_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check remote smoke config
        id: smoke-config
        run: |
          set -euo pipefail
          if [ -z "${PARTALOG_BASE_URL:-}" ]; then
            echo "Missing secret: PARTALOG_BASE_URL"
            echo "run_smoke=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${PARTALOG_PUBLIC_TOKEN:-}" ]; then
            echo "Missing secret: PARTALOG_PUBLIC_TOKEN"
            echo "run_smoke=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_smoke=true" >> "$GITHUB_OUTPUT"

      - name: Skip remote smoke without secrets
        if: steps.smoke-config.outputs.run_smoke != 'true'
        run: |
          echo "Remote regression smoke skipped because PARTALOG_BASE_URL/PARTALOG_PUBLIC_TOKEN are not configured for this PR."

      - name: Run regression smoke (remote)
        if: steps.smoke-config.outputs.run_smoke == 'true'
        run: |
          chmod +x backend/scripts/smoke_all.sh
          backend/scripts/smoke_all.sh \
            --skip-up \
            --skip-ai-check \
            --skip-frontend-check \
            --no-bootstrap \
            --base-url "${PARTALOG_BASE_URL}" \
            --public-token "${PARTALOG_PUBLIC_TOKEN:-}" \
            --admin-token "${PARTALOG_ADMIN_TOKEN:-}"
