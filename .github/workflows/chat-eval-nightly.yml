name: Chat Eval Nightly

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  nightly-chat-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PARTALOG_BASE_URL: ${{ secrets.PARTALOG_BASE_URL }}
      PARTALOG_PUBLIC_TOKEN: ${{ secrets.PARTALOG_PUBLIC_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate required secrets
        run: |
          set -euo pipefail
          [ -n "${PARTALOG_BASE_URL:-}" ] || (echo "Missing secret: PARTALOG_BASE_URL" && exit 1)
          [ -n "${PARTALOG_PUBLIC_TOKEN:-}" ] || (echo "Missing secret: PARTALOG_PUBLIC_TOKEN" && exit 1)

      - name: Install eval deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiohttp

      - name: Run nightly eval
        working-directory: partalog-ai
        run: |
          python eval/chat_eval.py \
            --base-url "$PARTALOG_BASE_URL" \
            --cases eval/queries.nightly.jsonl \
            --output-json eval/report.nightly.json \
            --output-md eval/report.nightly.md \
            --min-success-rate 0.95 \
            --min-hit-at-1 0.85 \
            --max-latency-p95-ms 10000 \
            --max-hallucination-rate 0.10 \
            --min-no-code-pass-rate 0.90

      - name: Build trend summary
        working-directory: partalog-ai
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          report = Path('eval/report.nightly.json')
          out = Path('eval/report.nightly.summary.md')
          data = json.loads(report.read_text(encoding='utf-8'))
          s = data.get('summary', {})

          lines = []
          lines.append('# Nightly Chat Eval Summary')
          lines.append('')
          lines.append(f"- Run (UTC): `{datetime.now(timezone.utc).isoformat()}`")
          lines.append(f"- Total: `{s.get('total', 0)}`")
          lines.append(f"- SuccessRate: `{s.get('success_rate', 0.0):.2%}`")
          lines.append(f"- Hit@1 / Hit@3 / Hit@5: `{s.get('hit_at_1', 0.0):.2%}` / `{s.get('hit_at_3', 0.0):.2%}` / `{s.get('hit_at_5', 0.0):.2%}`")
          lines.append(f"- MRR: `{s.get('mrr', 0.0):.3f}`")
          lines.append(f"- Latency p95 (ms): `{s.get('latency_ms_p95', 0.0):.1f}`")
          lines.append(f"- Hallucination rate: `{s.get('hallucination_rate', 0.0):.2%}`")
          lines.append(f"- No-code pass rate: `{s.get('no_code_pass_rate', 0.0):.2%}` (cases={s.get('no_code_case_count', 0)})")

          out.write_text('\n'.join(lines), encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Append summary to workflow run
        if: always()
        run: |
          cat partalog-ai/eval/report.nightly.summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-eval-nightly-${{ github.run_number }}
          path: |
            partalog-ai/eval/report.nightly.json
            partalog-ai/eval/report.nightly.md
            partalog-ai/eval/report.nightly.summary.md
