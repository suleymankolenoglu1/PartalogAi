name: Chat Eval Gate

on:
  pull_request:
    paths:
      - "partalog-ai/**"
      - ".github/workflows/chat-eval-gate.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "partalog-ai/**"
      - ".github/workflows/chat-eval-gate.yml"
  workflow_dispatch:

jobs:
  chat-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PARTALOG_BASE_URL: ${{ secrets.PARTALOG_BASE_URL }}
      PARTALOG_PUBLIC_TOKEN: ${{ secrets.PARTALOG_PUBLIC_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install eval deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiohttp

      - name: Validate relevance eval corpus
        working-directory: partalog-ai
        run: |
          python eval/chat_eval.py \
            --cases eval/queries.relevance.jsonl \
            --validate-only

      - name: Check remote eval config
        id: eval-config
        run: |
          set -euo pipefail
          if [ -z "${PARTALOG_BASE_URL:-}" ]; then
            echo "Missing secret: PARTALOG_BASE_URL"
            echo "run_eval=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${PARTALOG_PUBLIC_TOKEN:-}" ]; then
            echo "Missing secret: PARTALOG_PUBLIC_TOKEN"
            echo "run_eval=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_eval=true" >> "$GITHUB_OUTPUT"

      - name: Skip remote eval without secrets
        if: steps.eval-config.outputs.run_eval != 'true'
        run: |
          echo "Remote chat eval skipped because PARTALOG_BASE_URL/PARTALOG_PUBLIC_TOKEN are not configured for this PR."

      - name: Run chat eval thresholds
        if: steps.eval-config.outputs.run_eval == 'true'
        working-directory: partalog-ai
        run: |
          python eval/chat_eval.py \
            --base-url "$PARTALOG_BASE_URL" \
            --cases eval/queries.relevance.jsonl \
            --timeout-seconds 30 \
            --output-json eval/report.relevance.json \
            --output-md eval/report.relevance.md \
            --min-success-rate 1.0 \
            --min-hit-at-1 0.80 \
            --min-hit-at-3 0.90 \
            --min-hit-at-5 0.95 \
            --min-mrr 0.85 \
            --max-latency-p95-ms 8000 \
            --max-hallucination-rate 0.05 \
            --min-no-code-pass-rate 0.9 \
            --min-category-hit-at-1 exact_code=0.80 \
            --min-category-no-code-pass-rate negative=1.0

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-eval-report
          path: |
            partalog-ai/eval/report.relevance.json
            partalog-ai/eval/report.relevance.md
