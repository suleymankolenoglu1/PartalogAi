name: Chat Eval Gate

on:
  pull_request:
    paths:
      - "partalog-ai/**"
      - ".github/workflows/chat-eval-gate.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "partalog-ai/**"
      - ".github/workflows/chat-eval-gate.yml"
  workflow_dispatch:

jobs:
  chat-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PARTALOG_BASE_URL: ${{ secrets.PARTALOG_BASE_URL }}
      PARTALOG_PUBLIC_TOKEN: ${{ secrets.PARTALOG_PUBLIC_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate required secrets
        run: |
          set -euo pipefail
          if [ -z "${PARTALOG_BASE_URL:-}" ]; then
            echo "Missing secret: PARTALOG_BASE_URL"
            exit 1
          fi
          if [ -z "${PARTALOG_PUBLIC_TOKEN:-}" ]; then
            echo "Missing secret: PARTALOG_PUBLIC_TOKEN"
            exit 1
          fi

      - name: Install eval deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiohttp

      - name: Run chat eval thresholds
        working-directory: partalog-ai
        run: |
          python eval/chat_eval.py \
            --base-url "$PARTALOG_BASE_URL" \
            --cases eval/queries.hard.jsonl \
            --output-json eval/report.hard.json \
            --output-md eval/report.hard.md \
            --min-success-rate 1.0 \
            --min-hit-at-1 0.9 \
            --max-latency-p95-ms 8000 \
            --max-hallucination-rate 0.05 \
            --min-no-code-pass-rate 0.9

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-eval-report
          path: |
            partalog-ai/eval/report.hard.json
            partalog-ai/eval/report.hard.md
