<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 170" role="img" aria-label="partalog.tech logo dark">
  <defs>
    <style>
      .word { fill: #314b6d; font-family: Manrope, Inter, Arial, sans-serif; font-weight: 800; letter-spacing: -1.2px; }
      .tech { fill: #314b6d; font-family: Manrope, Inter, Arial, sans-serif; font-weight: 600; letter-spacing: -0.4px; }
      .gear { fill: #b3b8c0; }
      .hole { fill: #edf1f6; }
    </style>
    <rect id="tooth" x="-7" y="-56" width="14" height="16" rx="2" ry="2" />
  </defs>

  <text class="word" x="0" y="118" font-size="132">partal</text>

  <g transform="translate(396,82)">
    <circle class="gear" r="46" />
    <use href="#tooth" class="gear" transform="rotate(0)" />
    <use href="#tooth" class="gear" transform="rotate(30)" />
    <use href="#tooth" class="gear" transform="rotate(60)" />
    <use href="#tooth" class="gear" transform="rotate(90)" />
    <use href="#tooth" class="gear" transform="rotate(120)" />
    <use href="#tooth" class="gear" transform="rotate(150)" />
    <use href="#tooth" class="gear" transform="rotate(180)" />
    <use href="#tooth" class="gear" transform="rotate(210)" />
    <use href="#tooth" class="gear" transform="rotate(240)" />
    <use href="#tooth" class="gear" transform="rotate(270)" />
    <use href="#tooth" class="gear" transform="rotate(300)" />
    <use href="#tooth" class="gear" transform="rotate(330)" />
    <circle class="hole" r="22" />
  </g>

  <text class="word" x="454" y="118" font-size="132">g</text>
  <circle cx="610" cy="102" r="9" fill="#314b6d" />
  <text class="tech" x="630" y="118" font-size="84">tech</text>
</svg>
