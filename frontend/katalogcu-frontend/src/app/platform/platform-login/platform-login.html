<div class="platform-login-shell">
  <div class="platform-login-card">
    <div class="brand-line">
      <img src="assets/brand/partalog-logo-dark.svg" alt="partalog.tech">
      <span>Platform Ops</span>
    </div>

    <h1>Platform Girişi</h1>
    <p>Sadece platform yöneticileri için erişim ekranı.</p>

    <form (ngSubmit)="onLogin()">
      <label for="email">E-posta</label>
      <input id="email" name="email" type="email" [(ngModel)]="email" placeholder="ops@partalog.tech">

      <label for="password">Şifre</label>
      <div class="password-wrap">
        <input
          id="password"
          name="password"
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          placeholder="Şifre">
        <button type="button" (click)="togglePassword()">
          <span class="material-symbols-outlined">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>

      @if (errorMessage) {
        <div class="error">{{ errorMessage }}</div>
      }

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        @if (isLoading) {
          Giriş yapılıyor...
        } @else {
          Platforma Gir
        }
      </button>
    </form>

    <a class="back-link" routerLink="/login">Normal girişe dön</a>
  </div>
</div>
